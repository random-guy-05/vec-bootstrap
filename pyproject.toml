[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vec-bootstrap"
version = "1.0.0"
description = "Bootstrap uncertainty estimates for local Virtual Embryo Challenge scoring."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "anndata>=0.10,<0.13",
  "veckit==0.1.2",
]
keywords = ["virtual-embryo", "bootstrap", "uncertainty", "veckit"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vec-bootstrap = "vec_bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
